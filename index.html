    font-style: normal;
    font-display: swap;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
    color: #1a1a1a;
  }
  #cauldron {
    max-width: 90vw;
    max-height: 85vh;
    cursor: pointer;
    display: block;
    image-rendering: auto;
  }

  /* Modal */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #overlay.open { display: flex; }
  #modal {
    background: #ffffff;
    border-radius: 6px;
    padding: 36px 44px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    position: relative;
    max-width: 100%;
  }
  #close {
    position: absolute;
    top: 8px;
    right: 14px;
    background: none;
    border: none;
    font-size: 24px;
    line-height: 1;
    color: #999;
    cursor: pointer;
    font-family: inherit;
  }
  #close:hover { color: #333; }
  #date {
    font-family: 'Manuscript', Georgia, serif;
    font-size: 28px;
    letter-spacing: 0.02em;
    margin: 0 0 18px;
  }
  #countdown {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 6px;
    font-family: 'Manuscript', Georgia, serif;
  }
  .unit {
    min-width: 56px;
  }
  .num {
    font-size: 42px;
    line-height: 1.1;
  }
  /* fixed cell per digit so the seconds don't jitter as glyph widths change */
  .num span {
    display: inline-block;
    width: 0.52em;
    text-align: center;
  }
  .lab {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: #9a9a9a;
    margin-top: 6px;
  }
  .sep {
    font-family: 'Manuscript', Georgia, serif;
    font-size: 34px;
    line-height: 1.25;
    color: #c4c4c4;
  }
  @media (max-width: 480px) {
    #modal { padding: 30px 20px; }
    #date { font-size: 20px; }
    .unit { min-width: 42px; }
    .num { font-size: 30px; }
    .sep { font-size: 24px; }
    .lab { font-size: 9px; }
  }
</style>
</head>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="date">
  <div id="modal">
    <button id="close" aria-label="Close">&times;</button>
    <p id="date">December 23, 2026</p>
    <div id="countdown">
      <div class="unit"><div class="num" id="dd"><span>-</span><span>-</span></div><div class="lab">DAYS</div></div>
      <div class="sep">:</div>
      <div class="unit"><div class="num" id="hh"><span>-</span><span>-</span></div><div class="lab">HRS</div></div>
      <div class="sep">:</div>
      <div class="unit"><div class="num" id="mm"><span>-</span><span>-</span></div><div class="lab">MIN</div></div>
      <div class="sep">:</div>
      <div class="unit"><div class="num" id="ss"><span>-</span><span>-</span></div><div class="lab">SEC</div></div>
    </div>
  </div>
</div>

<script>
  // 6:00 PM on December 23, 2026, US Eastern (EST, UTC-5) => 23:00 UTC
  var TARGET = Date.UTC(2026, 11, 23, 23, 0, 0);

  var overlay   = document.getElementById('overlay');
  var img       = document.getElementById('cauldron');
  var closeBtn  = document.getElementById('close');
  var timer     = null;
  var out = {
    d: document.getElementById('dd'),
    h: document.getElementById('hh'),
    m: document.getElementById('mm'),
    s: document.getElementById('ss')
  };

  function pad(n, w) {
    n = String(n);
    while (n.length < w) n = '0' + n;
    return n;
  }

  // each digit gets its own fixed-width cell
  function put(el, str) {
    if (el.dataset.v === str) return;
    el.dataset.v = str;
    var out = '';
    for (var i = 0; i < str.length; i++) out += '<span>' + str.charAt(i) + '</span>';
    el.innerHTML = out;
  }

  function render() {
    var diff = TARGET - Date.now();
    if (diff < 0) diff = 0;
    var s = Math.floor(diff / 1000);
    var d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600);  s -= h * 3600;
    var m = Math.floor(s / 60);    s -= m * 60;
    put(out.d, pad(d, 2));
    put(out.h, pad(h, 2));
    put(out.m, pad(m, 2));
    put(out.s, pad(s, 2));
    if (diff === 0 && timer) { clearInterval(timer); timer = null; }
  }

  function open() {
    render();
    overlay.classList.add('open');
    if (!timer) timer = setInterval(render, 1000);
  }

  function close() {
    overlay.classList.remove('open');
    if (timer) { clearInterval(timer); timer = null; }
  }

  img.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) close();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') close();
  });
</script>
